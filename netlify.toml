# Netlify configuration for FilmHive
# Static frontend (no build step) + one serverless function for the AI verdict.

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Pretty API path: the client calls /api/verdict, which maps to the function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
